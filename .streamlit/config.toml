# =============================================================================
# Streamlit 界面配置（中文）
# =============================================================================

[theme]
base = "light"
# 书卷风：米白纸色 + 墨色字 + 朱印强调色，与 frontend/theme.py 的色板一致
primaryColor = "#A8442A"
backgroundColor = "#FAF7EF"
secondaryBackgroundColor = "#EFE9D8"
textColor = "#2C2A24"
font = "serif"

[client]
showErrorDetails = "full"
toolbarMode = "minimal"

[server]
headless = true
# 与后端 MAX_FILE_SIZE_MB(20) 保持一致，避免前端放行大文件后被后端拒绝
maxUploadSize = 20

[browser]
gatherUsageStats = false
