# =============================================================================
# Streamlit 界面配置（中文）
# =============================================================================

[theme]
base = "light"
primaryColor = "#3B6FD4"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = "full"
toolbarMode = "minimal"

[server]
headless = true
# 与后端 MAX_FILE_SIZE_MB(20) 保持一致，避免前端放行大文件后被后端拒绝
maxUploadSize = 20

[browser]
gatherUsageStats = false
